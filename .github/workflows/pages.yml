# 推上 main 後，把 dist/ 發布到 GitHub Pages（https://fr3636k.github.io/ya-hsuan/）
# 發布紀錄名稱：推送時 GitHub 會顯示該次提交訊息的第一行（符合 Conventional Commits）；手動執行時顯示下面的 name
name: "build(deploy): 發布 dist 到 GitHub Pages"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: 發布 dist
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
